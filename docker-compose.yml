version: "3.9"

# ── CPD-Pilot full stack ───────────────────────────────────────────────────────
#
# Services:
#   api      — FastAPI + DWSIM worker (port 8000)
#
# Future services (uncomment when ready):
#   web      — Next.js frontend (port 3000)
#   redis    — session cache / task queue
#
# Quick start:
#   cp .env.example .env          # add your ANTHROPIC_API_KEY
#   docker compose up --build
#
# The API docs are then available at http://localhost:8000/docs

services:

  api:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        DWSIM_VERSION: "8.8.7"
    image: cpd-pilot-api:latest
    container_name: cpd-pilot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DWSIM_PATH=/opt/dwsim
      - PYTHONPATH=/app
    volumes:
      # Persist generated files (.dwxmz, images, session DB) outside the container
      - cpd_outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Uncomment to add Redis for task queuing ──────────────────────────────────
  # redis:
  #   image: redis:7-alpine
  #   container_name: cpd-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

  # ── Uncomment when the Next.js web app is ready ──────────────────────────────
  # web:
  #   build:
  #     context: ./web
  #     dockerfile: Dockerfile
  #   container_name: cpd-pilot-web
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://api:8000
  #   depends_on:
  #     api:
  #       condition: service_healthy

volumes:
  cpd_outputs:
  # redis_data:
